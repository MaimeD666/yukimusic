[package]
name = "yukicloud"
version = "0.1.0"
description = "A personal SoundCloud desktop player"
edition = "2021"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "net", "io-util"] }
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rodio = { version = "0.20", default-features = false }
rustfft = "6"
base64 = "0.22"
sha2 = "0.10"
httpdate = "1"
souvlaki = "0.8.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
